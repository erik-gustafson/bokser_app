services:
  migrate:
    logging:
      driver: syslog
      options:
        syslog-address: tcp://127.0.0.1:5514
        syslog-format: rfc3164
        tag: "{{.Name}}"

  bokser_app_api:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BOKSER_STATE_ROOT: /app/private_state
    volumes:
      - ${BOKSER_STATE_HOST_PATH:?Set the private state host path before deployment}:/app/private_state:rw
    logging:
      driver: syslog
      options:
        syslog-address: tcp://127.0.0.1:5514
        syslog-format: rfc3164
        tag: "{{.Name}}"

  bokser_app_worker:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BOKSER_STATE_ROOT: /app/private_state
    volumes:
      - ${BOKSER_STATE_HOST_PATH:?Set the private state host path before deployment}:/app/private_state:rw
    logging:
      driver: syslog
      options:
        syslog-address: tcp://127.0.0.1:5514
        syslog-format: rfc3164
        tag: "{{.Name}}"
