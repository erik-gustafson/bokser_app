services:
  api:
    container_name: bokser_app_api_prod
    ports:
      - ${PROD_API_HOST_PORT:-8010}:8000
    environment:
      APP_ENV: prod

  worker:
    container_name: bokser_app_worker_prod
    environment:
      APP_ENV: prod
    volumes:
      - ${LAKE_HOST_PATH_PROD:-/volume1/data_lake/prod}:${LAKE_ROOT:-/data_lake}
