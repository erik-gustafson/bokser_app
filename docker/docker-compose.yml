name: ${COMPOSE_PROJECT_NAME:-bokser_app}

services:
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${APP_IMAGE:-bokser_app:latest}
    container_name: ${MIGRATE_CONTAINER_NAME:-bokser_app_migrate}
    working_dir: /app
    command: alembic -c /app/alembic.ini upgrade head
    networks: [db_net]
    restart: "no"
    env_file:
      - .env
    volumes:
      - ${LAKE_HOST_PATH}:${LAKE_ROOT}:rw
      - ${LOGS_HOST_PATH}:${LOGS_ROOT}:rw

  bokser_app_api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${APP_IMAGE:-bokser_app:latest}
    container_name: ${API_CONTAINER_NAME:-bokser_app_api}
    working_dir: /app
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - ${API_HOST_PORT:-8010}:8000
    networks: [db_net]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${LAKE_HOST_PATH}:${LAKE_ROOT}:rw
      - ${LOGS_HOST_PATH}:${LOGS_ROOT}:rw
      - ${DOWNLOADS_HOST_PATH}:${DOWNLOADS_ROOT}:rw
      - ${REPORTING_ARCHIVE_HOST_PATH}:${REPORTING_ARCHIVE_ROOT}:rw

  bokser_app_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${APP_IMAGE:-bokser_app:latest}
    container_name: ${WORKER_CONTAINER_NAME:-bokser_app_worker}
    working_dir: /app
    command: python -m src.worker.worker
    networks: [db_net]
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    volumes:
      - ${LAKE_HOST_PATH}:${LAKE_ROOT}:rw
      - ${LOGS_HOST_PATH}:${LOGS_ROOT}:rw
      - ${DOWNLOADS_HOST_PATH}:${DOWNLOADS_ROOT}:rw
      - ${REPORTING_ARCHIVE_HOST_PATH}:${REPORTING_ARCHIVE_ROOT}:rw

networks:
  db_net:
    external: ${DB_NET_EXTERNAL:-true}
    name: ${DB_NET_NAME:-db_net}
