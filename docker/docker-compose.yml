name: bokser_app

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LAKE_ROOT: ${LAKE_ROOT:-/data_lake}
  SOS_API_URL: ${SOS_API_URL:-https://api.example.com}
  SOS_STATIC_TOKEN: ${SOS_STATIC_TOKEN:-dev-token}
  SOS_AUTH_HEADER_NAME: ${SOS_AUTH_HEADER_NAME:-Authorization}
  SOS_AUTH_HEADER_PREFIX: ${SOS_AUTH_HEADER_PREFIX:-Bearer}
  SOS_POLL_INTERVAL_MINUTES: ${SOS_POLL_INTERVAL_MINUTES:-5}
  HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-30}
  HTTP_MAX_CONNECTIONS: ${HTTP_MAX_CONNECTIONS:-20}
  HTTP_MAX_KEEPALIVE_CONNECTIONS: ${HTTP_MAX_KEEPALIVE_CONNECTIONS:-10}
  HTTP_KEEPALIVE_EXPIRY_SECONDS: ${HTTP_KEEPALIVE_EXPIRY_SECONDS:-120}

services:
  # Placeholder HTTP service so deploy hooks can probe /health/status.
  # Replace this with your real API image/build when available.
  api:
    image: ${API_IMAGE:-hashicorp/http-echo:1.0.0}
    command:
      - -listen=:8000
      - -text={"status":"ok"}
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    image: ${WORKER_IMAGE:-bokser_app_worker:latest}
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - ${LAKE_HOST_PATH_DEV:-C:/Users/erik/Code/data_lake/dev}:${LAKE_ROOT:-/data_lake}
