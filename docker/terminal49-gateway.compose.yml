services:
  terminal49_gateway:
    image: nginx:stable-alpine
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    ports:
      - "127.0.0.1:8012:8080"
    volumes:
      - ./terminal49-gateway.conf:/etc/nginx/nginx.conf:ro
    networks: [db_net]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
