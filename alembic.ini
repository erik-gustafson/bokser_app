[alembic]
script_location = %(here)s/src/database/alembic
prepend_sys_path = %(here)s
path_separator = os

# Fallback only. env.py will use DatabaseSettings from .env.
sqlalchemy.url = postgresql+psycopg://bokser_admin@10.1.10.10:5434/bokser_app_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S